base_model: Qwen/Qwen2.5-1.5B
base_name: qwen2.5-1.5b
task: sft
dataset: allenai/tulu-3-sft-mixture
num_samples: 500
seed: 42
processed_path: data/processed/sft_500_smoke
max_length: 4096
packing: true
assistant_only_loss: true
learning_rate: 1.0e-05
num_train_epochs: 1
warmup_ratio: 0.03
lr_scheduler_type: linear
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
bf16: true
logging_steps: 10
use_wandb: false
save_strategy: steps
save_steps: 100
save_total_limit: 3
resume_from_checkpoint: true
wandb_resume: allow
