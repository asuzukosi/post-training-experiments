base_name: qwen2.5-1.5b
task: rs_sft

sft_checkpoint: null    # required; do not init from the raw base
processed_path: data/processed/rs_sft

max_length: 4096
packing: true
assistant_only_loss: true
learning_rate: 1.0e-5
num_train_epochs: 1
warmup_ratio: 0.03
lr_scheduler_type: linear
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
bf16: true
logging_steps: 10
use_wandb: true

save_strategy: steps
save_steps: 100
save_total_limit: 3
resume_from_checkpoint: true
wandb_resume: allow
