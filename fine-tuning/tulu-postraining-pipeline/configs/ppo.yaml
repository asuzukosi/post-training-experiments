base_name: qwen2.5-1.5b
task: ppo

sft_checkpoint: null
rm_checkpoint: null

dataset: HuggingFaceH4/ultrafeedback_binarized
split: test_prefs
num_prompts: 1500
seed: 42
processed_path: data/processed/ppo_1.5k

learning_rate: 1.0e-5
kl_coef: 0.05
cliprange: 0.2
ppo_epochs: 1
batch_size: 8
mini_batch_size: 2
gradient_accumulation_steps: 4
max_prompt_length: 1024
max_new_tokens: 512

# needs an 80GB card: trl stacks full-vocab logits for every generated position,
# batch x grad_acc x max_new_tokens x vocab x 4 = 9.27 GiB on top of four models,
# and that does not shrink with model size.

# the only way to bound the run — trl overwrites max_steps and ignores it.
total_episodes: 1472

num_sample_generations: 10
num_eval_prompts: 32
per_device_eval_batch_size: 1

bf16: true
logging_steps: 5
use_wandb: true
score_eos_only: true

save_strategy: steps
save_steps: 10          # must stay under the ~46 total updates or nothing is saved
save_total_limit: 3
resume_from_checkpoint: true
wandb_resume: allow
