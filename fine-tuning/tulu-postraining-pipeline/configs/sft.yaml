base_name: qwen2.5-1.5b
task: sft
model: Qwen/Qwen2.5-1.5B

dataset: allenai/tulu-3-sft-mixture
num_samples: 25000
seed: 42
processed_path: data/processed/sft_25k

max_length: 4096
packing: true
num_train_epochs: 1
learning_rate: 1.0e-5
warmup_ratio: 0.03
lr_scheduler_type: linear
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
bf16: true
logging_steps: 10
use_wandb: true

save_strategy: steps
save_steps: 200
save_total_limit: 3
resume_from_checkpoint: true
wandb_resume: allow
