base_name: qwen2.5-1.5b
task: sft
base_model: Qwen/Qwen2.5-1.5B

dataset: allenai/tulu-3-sft-mixture
num_samples: 25000
seed: 42
processed_path: data/processed/sft_25k

max_length: 4096
packing: true
num_train_epochs: 1
learning_rate: 1.0e-5
warmup_ratio: 0.03
lr_scheduler_type: linear
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
bf16: true
logging_steps: 10
use_wandb: true

save_strategy: steps
save_steps: 200
save_total_limit: 3
resume_from_checkpoint: true
wandb_resume: allow

# mid-training mmlu tripwire: 4 evenly spaced checks against the in-memory model via
# lm-eval's hf backend. aborts the run if mmlu falls more than the limit, so a collapsed
# run stops instead of finishing. set tripwire_evals: 0 to turn it off.
tripwire_evals: 4
tripwire_questions: 5          # per mmlu subject -> 285 questions
tripwire_max_drop: 5.0        # points; the run stops if mmlu falls further
