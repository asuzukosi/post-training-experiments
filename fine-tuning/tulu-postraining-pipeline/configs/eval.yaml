judge_model: Qwen/Qwen2.5-32B-Instruct
bon_judge_model: Qwen/Qwen2.5-14B-Instruct
bon_processed_path: data/processed/rs_sft
# candidates per prompt for the rejection-sampling arm. single-elim is n-1 judged
# comparisons per prompt, so n=8 is 70k comparisons over the 10k prompts and n=4 is
# 30k. the arm asks whether rejection sampling matches dpo and ppo, not how it
# scales in n, so 4 answers the same question for 43% of the judge time.
bon_num_samples: 4
# how deep each skills axis runs. mmlu is 25 per subject x 57 = 1,425 questions, which
# resolves the 5-point broken-run alarm at +/-1.3; the full 14,042 buys +/-0.4 for 10x the
# cost. ifeval is only 541 questions, so it runs whole ("all").
skills_task_limits:
  mmlu: 25
  ifeval: all

metrics_dir: results/metrics
