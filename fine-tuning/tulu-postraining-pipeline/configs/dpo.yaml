base_name: qwen2.5-1.5b

sft_checkpoint: null

dataset: HuggingFaceH4/ultrafeedback_binarized
split: train_prefs
num_pairs: 10000
seed: 42
processed_path: data/processed/dpo_10k

betas: [0.05, 0.1]      # one beta per invocation; task becomes dpo-b0.05 / dpo-b0.1
learning_rate: 5.0e-7
num_train_epochs: 1
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
max_length: 2048
max_prompt_length: 1024
bf16: true
logging_steps: 10
use_wandb: true
precompute_ref_log_probs: true

save_strategy: steps
save_steps: 100
save_total_limit: 3
resume_from_checkpoint: true
wandb_resume: allow

# mid-training mmlu tripwire: 4 evenly spaced checks against the in-memory model via
# lm-eval's hf backend. aborts the run if mmlu falls more than the limit, so a collapsed
# run stops instead of finishing. set tripwire_evals: 0 to turn it off.
tripwire_evals: 4
tripwire_questions: 5          # per mmlu subject -> 285 questions
tripwire_max_drop: 5.0        # points; the run stops if mmlu falls further
