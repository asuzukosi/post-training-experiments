base_name: qwen2.5-1.5b
task: rm

sft_checkpoint: null

dataset: HuggingFaceH4/ultrafeedback_binarized
split: train_prefs
num_pairs: 20000
seed: 42
processed_path: data/processed/rm_20k

num_train_epochs: 1     # forced by the trainer; more than one overfits badly
learning_rate: 1.0e-5
per_device_train_batch_size: 4
gradient_accumulation_steps: 16
max_length: 2048
bf16: true
logging_steps: 10
use_wandb: true

save_strategy: steps
save_steps: 100
save_total_limit: 3
resume_from_checkpoint: true
wandb_resume: allow
