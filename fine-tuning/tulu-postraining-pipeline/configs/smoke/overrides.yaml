max_steps: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
bf16: false
fp16: false
logging_steps: 1
save_strategy: "no"
use_wandb: false
warmup_ratio: 0.0

# off by default: a smoke runs 2 steps, and the tripwire would fire at step 1 and run
# 285 mmlu questions inside it. the tripwire itself is exercised by its own smoke.
tripwire_evals: 0
